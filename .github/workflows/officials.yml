# Keeps https://apponur.com/data/officials/v1.json current: the President, Vice President, Speaker,
# Chief Justice and every state's senators, representatives, governor and capital, as the
# US Citizenship Test apps show them. See .github/scripts/officials.py for the sources and checks.
#
# A run that can't confirm a fact keeps its previous value, commits the rest and then fails,
# so GitHub emails the repository owner. Secrets: CONGRESS_API_KEY (free, api.data.gov).
name: Officials data

on:
  schedule:
    - cron: "17 */6 * * *"  # Every 6 hours.
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: officials
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        id: build
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: |
          set +e
          python3 .github/scripts/officials.py --previous data/officials/v1.json --out data/officials/v1.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0: all confirmed; 1: written, some facts kept from before; 2: nothing written.
          if [ "$code" -ge 2 ]; then exit "$code"; fi
          exit 0

      - name: Commit
        id: commit
        run: |
          if git diff --quiet -- data/officials; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only the check time changed: commit once a day, so the history stays readable.
          changed=$(git diff -U0 -- data/officials | grep -E '^[-+] ' | grep -v '"checkedAt"' | wc -l)
          previous_check=$(git show HEAD:data/officials/v1.json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("checkedAt","")[:10])' || true)
          if [ "$changed" -eq 0 ] && [ "$previous_check" = "$(date -u +%F)" ]; then
            git checkout -- data/officials
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/officials
          if [ "$changed" -eq 0 ]; then message="Officials data: checked"; else message="Officials data: updated"; fi
          git commit -m "$message"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN may not start a Pages build on their own.
      - name: Publish
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      - name: Fail when a fact was kept from before
        if: steps.build.outputs.code == '1'
        run: |
          echo "Some facts couldn't be confirmed by two sources and kept their previous value. See the run summary."
          exit 1
